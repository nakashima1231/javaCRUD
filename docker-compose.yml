services:
  db:
    image: postgres:18
    container_name: loja-db
    environment:
      POSTGRES_DB: loja
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - loja-dados:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d loja"]
      interval: 5s
      retries: 10

  api:
    build: .
    container_name: loja-api
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/loja
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  loja-dados: